org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# NOTE: do NOT add org.gradle.daemon=false here. The daemon works fine
# on a normal machine (his Windows laptop). It is only THIS Linux VM's
# sandbox that blocks the Gradle daemon's JVM loopback TCP, so Android
# APK builds cannot run on this VM at all — build the APK on the
# laptop instead (see WINDOWS-BUILD.md). Adding daemon=false here
# would only slow down normal builds.
android.useAndroidX=true
android.enableJetifier=true
